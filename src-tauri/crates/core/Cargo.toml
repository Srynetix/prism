[package]
name = "prism-core"
description = "Prism's model: the config (packs, profiles, settings), the snapshot the window shows and its hub, team conventions, the forge and tracker providers, the blocks' contract."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# The window's types (`web/src/bindings`), exported by the app's tests.
ts = ["dep:ts-rs"]
# The config's JSON schema (`schemars`), for `prism mcp`: in the binaries only.
schema = ["dep:schemars"]
# What the other crates' tests use: the forges' tools answered from memory (`forge::cli::fake`).
testing = []

[dependencies]
prism-base.workspace = true
prism-sys.workspace = true

anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
dirs.workspace = true
futures.workspace = true
jiff.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ts-rs = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
# Paused time: the collection pace (Hub::pause) tested without waiting.
tokio = { workspace = true, features = ["test-util"] }
