[package]
name = "prism-commands"
description = "Prism running, without its window: the state its commands share, the commands themselves and their table (class from a phone, demo rule), the collectors started and restarted, the remote's side of Prism. The window's app registers them with Tauri (`tauri`); a server without a window calls them as a phone does."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# The commands registered with Tauri (`#[tauri::command]`, `handler`): the window's app.
tauri = ["dep:tauri"]
# The window's types (`web/src/bindings`), exported by the app's tests.
ts = ["dep:ts-rs", "prism-core/ts", "prism-collectors/ts", "prism-agents/ts", "prism-blocks/ts", "prism-ops/ts"]

[dependencies]
prism-base.workspace = true
prism-core.workspace = true
prism-collectors.workspace = true
prism-agents.workspace = true
prism-blocks.workspace = true
prism-ops.workspace = true
prism-demo.workspace = true
prism-remote.workspace = true
prism-macos.workspace = true
prism-macros.workspace = true

anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
futures.workspace = true
notify.workspace = true
regex.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tauri = { version = "2", default-features = false, optional = true }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
