fragment Checks on Commit {
  oid url committedDate
  statusCheckRollup { state
    contexts(first: 100) { nodes { __typename
      ... on CheckRun { databaseId name status conclusion startedAt completedAt detailsUrl deployment { databaseId }
        checkSuite { workflowRun { databaseId url createdAt workflow { name } } } }
      ... on StatusContext { context state targetUrl createdAt } } } }
}
