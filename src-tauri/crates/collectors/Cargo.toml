[package]
name = "prism-collectors"
description = "Prism's sources: the forge (GitLab, GitHub), the tracker (ClickUp, Jira, Obsidian), CI, clusters, calendar, mail, usage, vulnerabilities… each read into the snapshot, and the actions the window asks of them."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# The window's types (`web/src/bindings`), exported by the app's tests.
ts = ["dep:ts-rs", "prism-core/ts"]

[dependencies]
prism-base.workspace = true
prism-core.workspace = true
prism-macos.workspace = true

anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
dirs.workspace = true
futures.workspace = true
k8s-openapi.workspace = true
kube.workspace = true
notify.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
ts-rs = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
prism-core = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
