[package]
name = "prism-macos"
description = "Prism's calls into Apple's frameworks (EventKit, CoreAudio, AppKit, CoreWLAN, LocalAuthentication): every unsafe block they need, behind safe types and functions. Empty on other systems."
version.workspace = true
edition.workspace = true
license.workspace = true

# The only crates allowed `unsafe` (with prism-sys): each block says why it holds.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-event-kit.workspace = true
objc2-foundation = { workspace = true, features = ["NSLocale", "NSOperation"] }
objc2-speech = { version = "0.3", features = ["SFSpeechRecognizer", "SFSpeechRecognitionRequest", "SFSpeechRecognitionResult", "SFSpeechRecognitionTask", "SFTranscription", "block2", "objc2-avf-audio"] }
objc2-avf-audio = { version = "0.3", features = ["AVAudioBuffer", "AVAudioFormat", "AVAudioTypes"] }
