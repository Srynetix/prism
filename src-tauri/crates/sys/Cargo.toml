[package]
name = "prism-sys"
description = "Prism's calls into the C library and WebKitGTK: every unsafe block of the app but Apple's frameworks (prism-macos), behind safe functions."
version.workspace = true
edition.workspace = true
license.workspace = true

# The only crates allowed `unsafe` (with prism-macos): each block says why it holds.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[dependencies]
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Windows' calls: processes, the Recycle Bin, sleep, folders' ACLs (windows-sys), Windows Hello
# (WinRT, windows) and the audio devices (Core Audio, windows): the versions Tauri already brings.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Power", "Win32_System_Threading", "Win32_UI_Shell"] }
windows = { version = "0.62", features = ["Foundation", "Security_Credentials_UI", "Win32_Devices_FunctionDiscovery", "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Shell_PropertiesSystem"] }
windows-core = "0.62"
windows-future = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
# The WebKitGTK version (the app's main.rs); Tauri's own.
webkit2gtk = "2"
