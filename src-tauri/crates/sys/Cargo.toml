[package]
name = "prism-sys"
description = "Prism's calls into the C library and WebKitGTK: every unsafe block of the app but Apple's frameworks (prism-macos), behind safe functions."
version.workspace = true
edition.workspace = true
license.workspace = true

# The only crates allowed `unsafe` (with prism-macos): each block says why it holds.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[dependencies]
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# The WebKitGTK version (the app's main.rs); Tauri's own.
webkit2gtk = "2"
