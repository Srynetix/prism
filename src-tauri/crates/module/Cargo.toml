# What a module's back end is written with: Prism's `blocks::sdk`, the same names, for a
# WebAssembly component (`cargo build --target wasm32-wasip2`). Used from Prism's repository:
#   prism-module = { git = "https://github.com/Srynetix/prism", tag = "module-v1.0.0" }
# Its fields are its own (not the workspace's): it builds apart from Prism.
[package]
name = "prism-module"
description = "Write a Prism module's back end: its blocks as Prism's own (`impl Block`), run as a WebAssembly component."
version = "1.0.0"
edition = "2024"
license = "MIT"

# wit-bindgen's code is `unsafe` (the component's exports and imports).
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
futures = { version = "0.3.34", default-features = false, features = ["std", "alloc"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
wit-bindgen = "0.57"
