[package]
name = "prism-blocks"
description = "Prism's own blocks (Docker, Disk usage, Dev servers, Data, Day trail, Pet, Status, System, Sound, Custom blocks) and the SDK a team's blocks are written against."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# The window's types (`web/src/bindings`), exported by the app's tests.
ts = ["dep:ts-rs", "prism-core/ts", "prism-collectors/ts", "prism-agents/ts"]
# The blocks' settings as JSON schemas (`Block::schema`), for `prism mcp`: in the binaries only.
schema = ["dep:schemars", "prism-core/schema"]

[dependencies]
prism-base.workspace = true
prism-core.workspace = true
prism-collectors.workspace = true
prism-agents.workspace = true
prism-sys.workspace = true
prism-macos.workspace = true

anyhow.workspace = true
chrono.workspace = true
dirs.workspace = true
futures.workspace = true
regex.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo.workspace = true
uuid.workspace = true
schemars = { workspace = true, optional = true }
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
