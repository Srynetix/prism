[package]
name = "prism-blocks"
description = "Prism's own blocks (Docker, Dev servers, Data, Day trail, Pet, Status, System, Sound) and the SDK a team's blocks are written against."
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# The window's types (`web/src/bindings`), exported by the app's tests.
ts = ["dep:ts-rs", "prism-core/ts", "prism-collectors/ts", "prism-agents/ts"]

[dependencies]
prism-base.workspace = true
prism-core.workspace = true
prism-collectors.workspace = true
prism-agents.workspace = true
prism-sys.workspace = true
prism-macos.workspace = true

anyhow.workspace = true
chrono.workspace = true
futures.workspace = true
regex.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
