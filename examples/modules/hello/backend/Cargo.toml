# The back end of the example module: a WebAssembly component (the `prism:module` world).
#   cargo build --release --target wasm32-wasip2   (`just module-example` builds and copies it)
[package]
name = "prism-module-hello"
version = "1.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.57"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true

# Apart from Prism's workspace.
[workspace]
