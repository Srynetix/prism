# The back end of the example module: its block written as a block of Prism, built into a
# WebAssembly component (the `prism:module` world) with `prism-module`.
#   cargo build --release --target wasm32-wasip2   (`just module-example` builds and copies it)
[package]
name = "prism-module-hello"
version = "1.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Outside Prism's repository: prism-module = { git = "https://github.com/Srynetix/prism", tag = "module-v1.0.0" }
prism-module = { path = "../../../../src-tauri/crates/module" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = { version = "0.3", default-features = false, features = ["std", "alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true

# Apart from Prism's workspace.
[workspace]
